name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Tests
        run: npm test

      - name: Web-Dateien in Ordner www kopieren
        run: |
          mkdir -p www
          cp index.html app.js logic.js style.css www/
          echo "{\"build\": ${{ github.run_number }}, \"repo\": \"${{ github.repository }}\"}" > www/version.json

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Berechtigungen ergänzen
        run: node patch-android.js

      - name: Web-App synchronisieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: familienplaner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Familienplaner.apk
          gh release create "v${{ github.run_number }}" Familienplaner.apk \
            --title "Familienplaner ${{ github.run_number }}" \
            --notes "Automatisch gebaut. Datei Familienplaner.apk laden und installieren." \
            --latest
