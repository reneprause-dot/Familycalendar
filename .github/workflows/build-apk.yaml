name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Tests
        run: npm test

      - name: Web-Dateien in Ordner www kopieren
        run: |
          mkdir -p www
          cp index.html app.js logic.js style.css www/

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Berechtigungen ergänzen
        run: node patch-android.js

      - name: Web-App synchronisieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: familienplaner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
